name: Manual Desktop Build

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Artifact zip name (without .zip)"
        required: false
        default: "ffta2-editor"

jobs:
  build-windows-desktop:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build runtime image with Maven
        run: mvn -B -ntp clean compile javafx:jlink

      - name: Build desktop app image
        run: >
          jpackage
          --type app-image
          --module org.ruru.ffta2editor/org.ruru.ffta2editor.App
          --name ffta2-editor
          --runtime-image target/image
          --dest dist

      - name: Include custom patches in app image
        shell: pwsh
        run: |
          $dest = "dist/ffta2-editor/custom-patches"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Path "patches/*.yaml" -Destination $dest -Force
          Get-ChildItem $dest | ForEach-Object { $_.Name }

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist/ffta2-editor/**
          if-no-files-found: error
